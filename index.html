<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Cihan City Mobile</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1016;font-family:Arial,sans-serif;color:#fff}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:fixed;left:10px;top:10px;background:rgba(0,0,0,.62);padding:10px 12px;border-radius:12px;z-index:3;max-width:72vw}
#title{font-size:20px;font-weight:900;color:#ffd84f;letter-spacing:1px}
#stats,#mission{font-size:12px;margin-top:5px}
#stars{position:fixed;right:12px;top:12px;font-size:24px;z-index:3}
#msg{position:fixed;left:50%;top:22%;transform:translateX(-50%);background:rgba(0,0,0,.75);padding:10px 15px;border-radius:10px;opacity:0;transition:.2s;z-index:4;text-align:center}
#controls{position:fixed;left:0;right:0;bottom:14px;display:flex;justify-content:space-between;padding:0 12px;z-index:5;pointer-events:none}
.pad,.actions{pointer-events:auto}
.pad>button{display:block;margin:auto}
.pad div{display:flex;gap:6px;margin-top:6px}
.actions{display:grid;grid-template-columns:76px 76px;gap:8px;align-content:end}
button{border:1px solid rgba(255,255,255,.18);background:rgba(8,13,20,.76);color:#fff;border-radius:15px;min-width:58px;min-height:54px;font-weight:900;font-size:14px;touch-action:none;user-select:none}
#start{position:fixed;inset:0;background:linear-gradient(145deg,#101927,#321b22);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20}
#start h1{font-size:44px;margin:0;color:#ffd84f;text-shadow:0 6px 22px #000}
#start p{color:#d7e0ee}
#start button{padding:0 28px;background:#d99a1d;font-size:18px}
</style>
</head>
<body>
<div id="start">
  <h1>CIHAN CITY</h1>
  <p>Mobile Edition</p>
  <button id="play">OYUNA BAŞLA</button>
</div>

<canvas id="game"></canvas>
<div id="hud">
  <div id="title">CIHAN CITY</div>
  <div id="stats"></div>
  <div id="mission"></div>
</div>
<div id="stars"></div>
<div id="msg"></div>

<div id="controls">
  <div class="pad">
    <button data-k="up">▲</button>
    <div>
      <button data-k="left">◀</button>
      <button data-k="down">▼</button>
      <button data-k="right">▶</button>
    </div>
  </div>
  <div class="actions">
    <button data-k="fire">ATEŞ</button>
    <button data-k="use">ARAÇ</button>
    <button data-k="run">NİTRO</button>
    <button data-k="save">KAYDET</button>
  </div>
</div>

<script>
const c=document.getElementById('game'),x=c.getContext('2d');
const stats=document.getElementById('stats'),missionEl=document.getElementById('mission'),stars=document.getElementById('stars'),msg=document.getElementById('msg');
let W=innerWidth,H=innerHeight,dpr=devicePixelRatio||1;
function resize(){W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();

const world={w:4200,h:2800};
const keys={up:0,down:0,left:0,right:0,fire:0,use:0,run:0,save:0};
document.querySelectorAll('[data-k]').forEach(b=>{
  const k=b.dataset.k;
  const on=e=>{e.preventDefault();keys[k]=1};
  const off=e=>{e.preventDefault();keys[k]=0};
  b.addEventListener('touchstart',on,{passive:false}); b.addEventListener('touchend',off,{passive:false});
  b.addEventListener('mousedown',on); b.addEventListener('mouseup',off); b.addEventListener('mouseleave',off);
});
addEventListener('keydown',e=>{
  if(e.key==='ArrowUp'||e.key==='w')keys.up=1;if(e.key==='ArrowDown'||e.key==='s')keys.down=1;
  if(e.key==='ArrowLeft'||e.key==='a')keys.left=1;if(e.key==='ArrowRight'||e.key==='d')keys.right=1;
  if(e.key==='e')keys.use=1;if(e.key==='f')keys.fire=1;if(e.key==='Shift')keys.run=1;
});
addEventListener('keyup',e=>{
  if(e.key==='ArrowUp'||e.key==='w')keys.up=0;if(e.key==='ArrowDown'||e.key==='s')keys.down=0;
  if(e.key==='ArrowLeft'||e.key==='a')keys.left=0;if(e.key==='ArrowRight'||e.key==='d')keys.right=0;
  if(e.key==='e')keys.use=0;if(e.key==='f')keys.fire=0;if(e.key==='Shift')keys.run=0;
});

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y), rnd=(a,b)=>a+Math.random()*(b-a);
const roads=[];
[400,1050,1750,2550,3350,3950].forEach(xx=>roads.push({x:xx,y:0,w:160,h:world.h,d:'v'}));
[350,950,1550,2150,2650].forEach(yy=>roads.push({x:0,y:yy,w:world.w,h:150,d:'h'}));
const buildings=[];
for(let gx=30;gx<world.w-200;gx+=310)for(let gy=30;gy<world.h-180;gy+=270){
  const b={x:gx,y:gy,w:200+rnd(0,55),h:150+rnd(0,45)};
  if(!roads.some(r=>b.x<r.x+r.w&&b.x+b.w>r.x&&b.y<r.y+r.h&&b.y+b.h>r.y))buildings.push(b);
}

const p={x:620,y:620,a:0,hp:100,armor:0,money:1000,ammo:50,car:null};
const cars=[];
for(let i=0;i<20;i++)cars.push({x:rnd(200,world.w-200),y:rnd(200,world.h-200),a:rnd(0,6.28),s:0,color:['#d84b4b','#2f8fd6','#d5ad3a','#6d58c8','#45a46e'][i%5],owned:i<2,nitro:100});
const npcs=[];for(let i=0;i<55;i++)npcs.push({x:rnd(50,world.w-50),y:rnd(50,world.h-50),a:rnd(0,6.28),police:false,hp:50});
const bullets=[];
let wanted=0,useLatch=0,fireT=0,mission=0,checkpoint={x:3650,y:2300},messageT=0;

function say(t){msg.textContent=t;msg.style.opacity=1;messageT=120}
function nearestCar(){let best=null,bd=999;cars.forEach(v=>{const d=dist(p,v);if(d<bd){bd=d;best=v}});return bd<75?best:null}
function save(){localStorage.setItem('cihanMobile',JSON.stringify({x:p.x,y:p.y,money:p.money,ammo:p.ammo,mission,wanted}));say('Oyun kaydedildi')}
function load(){try{const s=JSON.parse(localStorage.getItem('cihanMobile'));if(s)Object.assign(p,{x:s.x,y:s.y,money:s.money,ammo:s.ammo}),mission=s.mission||0,wanted=s.wanted||0}catch{}}
load();

function update(){
  if(keys.save){keys.save=0;save()}
  if(keys.use&&!useLatch){
    useLatch=1;
    if(p.car){p.car=null;p.x+=50;p.y+=20}
    else{const car=nearestCar();if(car){p.car=car;if(!car.owned){wanted=Math.max(1,wanted);say('Araç çalındı!')}}}
  }
  if(!keys.use)useLatch=0;

  if(p.car){
    const car=p.car;
    if(keys.up)car.s+=.17;if(keys.down)car.s-=.13;
    const max=keys.run&&car.nitro>0?(car.nitro-=.5,11):7.5;
    if(!keys.run)car.nitro=Math.min(100,car.nitro+.05);
    car.s=clamp(car.s,-3,max);car.s*=.985;
    const steer=.035*(Math.abs(car.s)/7.5+.2);
    if(keys.left)car.a-=steer*Math.sign(car.s||1);if(keys.right)car.a+=steer*Math.sign(car.s||1);
    car.x=clamp(car.x+Math.cos(car.a)*car.s,20,world.w-20);
    car.y=clamp(car.y+Math.sin(car.a)*car.s,20,world.h-20);
    p.x=car.x;p.y=car.y;
  }else{
    let dx=keys.right-keys.left,dy=keys.down-keys.up;
    if(dx||dy){const l=Math.hypot(dx,dy),sp=keys.run?5.1:3.1;p.x+=dx/l*sp;p.y+=dy/l*sp;p.a=Math.atan2(dy,dx)}
    p.x=clamp(p.x,15,world.w-15);p.y=clamp(p.y,15,world.h-15);
    if(keys.fire&&performance.now()-fireT>220&&p.ammo>0){
      fireT=performance.now();p.ammo--;wanted=Math.max(1,wanted);
      bullets.push({x:p.x+Math.cos(p.a)*20,y:p.y+Math.sin(p.a)*20,vx:Math.cos(p.a)*10,vy:Math.sin(p.a)*10,l:75,from:true});
    }
  }

  npcs.forEach(n=>{
    if(n.police){n.a=Math.atan2(p.y-n.y,p.x-n.x);n.x+=Math.cos(n.a)*1.1;n.y+=Math.sin(n.a)*1.1}
    else{if(Math.random()<.01)n.a+=rnd(-1,1);n.x+=Math.cos(n.a)*.55;n.y+=Math.sin(n.a)*.55}
  });
  if(wanted>0&&Math.random()<.006)for(let i=0;i<wanted;i++)npcs.push({x:p.x+rnd(-400,400),y:p.y+rnd(-400,400),a:0,police:true,hp:80});

  bullets.forEach(b=>{b.x+=b.vx;b.y+=b.vy;b.l--;npcs.forEach(n=>{if(b.from&&n.hp>0&&Math.hypot(b.x-n.x,b.y-n.y)<15){n.hp-=35;b.l=0;if(n.police)wanted=Math.min(5,wanted+1)}})});
  for(let i=npcs.length-1;i>=0;i--)if(npcs[i].hp<=0)npcs.splice(i,1);
  for(let i=bullets.length-1;i>=0;i--)if(bullets[i].l<=0)bullets.splice(i,1);

  if(dist(p,checkpoint)<70){
    if(mission===0){mission=1;p.money+=750;checkpoint={x:850,y:2100};say('Görev tamamlandı: +₺750')}
    else if(mission===1){mission=2;p.money+=1200;checkpoint={x:3850,y:650};say('İkinci görev tamamlandı: +₺1200')}
    else if(mission===2){mission=3;p.money+=2000;say('Ana görevler tamamlandı!')}
  }
  if(messageT>0){messageT--;if(!messageT)msg.style.opacity=0}
  if(Math.random()<.0008&&wanted>0)wanted--;
  stats.textContent=`Can ${p.hp} • Para ₺${p.money} • Mermi ${p.ammo}${p.car?` • Nitro ${Math.round(p.car.nitro)}`:''}`;
  missionEl.textContent=mission===0?'Görev: Sarı noktaya araçla git':mission===1?'Görev: Şehrin diğer ucuna ulaş':mission===2?'Görev: Liman bölgesine git':'Ana görevler tamamlandı';
  stars.textContent='★'.repeat(wanted)+'☆'.repeat(5-wanted);
}

function drawRoad(r){
  x.fillStyle='#3b4047';x.fillRect(r.x,r.y,r.w,r.h);x.strokeStyle='#e7cf62';x.lineWidth=4;x.setLineDash([28,22]);x.beginPath();
  if(r.d==='h'){x.moveTo(r.x,r.y+r.h/2);x.lineTo(r.x+r.w,r.y+r.h/2)}else{x.moveTo(r.x+r.w/2,r.y);x.lineTo(r.x+r.w/2,r.y+r.h)}
  x.stroke();x.setLineDash([]);
}
function draw(){
  const camX=clamp(p.x-W/2,0,world.w-W),camY=clamp(p.y-H/2,0,world.h-H);
  x.clearRect(0,0,W,H);x.save();x.translate(-camX,-camY);
  x.fillStyle='#3f744a';x.fillRect(0,0,world.w,world.h);roads.forEach(drawRoad);
  buildings.forEach((b,i)=>{x.fillStyle='rgba(0,0,0,.25)';x.fillRect(b.x+10,b.y+10,b.w,b.h);x.fillStyle=['#77695f','#66798a','#8b8069'][i%3];x.fillRect(b.x,b.y,b.w,b.h);
    x.fillStyle='rgba(255,229,155,.55)';for(let xx=b.x+18;xx<b.x+b.w-15;xx+=36)for(let yy=b.y+22;yy<b.y+b.h-15;yy+=32)x.fillRect(xx,yy,17,12);
  });
  if(mission<3){x.strokeStyle='#ffe24e';x.lineWidth=6;x.beginPath();x.arc(checkpoint.x,checkpoint.y,34+Math.sin(performance.now()/180)*5,0,6.28);x.stroke()}
  cars.forEach(v=>{x.save();x.translate(v.x,v.y);x.rotate(v.a);x.fillStyle=v.color;x.fillRect(-28,-14,56,28);x.fillStyle='#a8d6ea';x.fillRect(-8,-11,22,22);x.fillStyle='#111';x.fillRect(-20,-18,12,6);x.fillRect(10,-18,12,6);x.fillRect(-20,12,12,6);x.fillRect(10,12,12,6);x.restore()});
  npcs.forEach(n=>{x.fillStyle=n.police?'#2453a0':'#d7ad89';x.beginPath();x.arc(n.x,n.y,10,0,6.28);x.fill();x.fillStyle=n.police?'#15346d':'#5a4a73';x.fillRect(n.x-7,n.y+7,14,18)});
  bullets.forEach(b=>{x.fillStyle='#ffe36e';x.beginPath();x.arc(b.x,b.y,3,0,6.28);x.fill()});
  if(!p.car){x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle='#1d2a48';x.fillRect(-9,2,18,25);x.fillStyle='#e4b68d';x.beginPath();x.arc(0,-6,10,0,6.28);x.fill();x.restore()}
  x.restore();
}
function loop(){update();draw();requestAnimationFrame(loop)}
document.getElementById('play').onclick=()=>{document.getElementById('start').style.display='none';loop()};
</script>
</body>
</html>
